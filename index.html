<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>8 будинок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ===== Кольори 8 будинку ===== */
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --ink:#23262B; --muted:#5F6670; --line:#E6E8EB; --line2:#D5D9DE;
  --graph:#4A4F57; --grey:#A9AFB7; --yellow:#F2C12E; --yellow-d:#DFAE1C;
  --ok-bg:#DCEFE5; --ok:#1E6B4A; --bad-bg:#F7E0DA; --bad:#8A2E12; --info-bg:#E6E8EB; --info:#3A3F47; --soft:#EEF0F2; --yel-bg:#FCEFC2; --yel-ink:#6B5300;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;font-size:.9375rem;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;padding:18px 16px 112px;display:flex;flex-direction:column;gap:14px}
.h1{font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0}
.h2{font-weight:800;font-size:21px;letter-spacing:-.02em;margin:0}
.sub{font-size:13px;color:var(--muted);font-weight:600}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:15px;font-weight:700}
.t-ok{color:var(--ok)} .t-bad{color:var(--bad)} .t-info{color:var(--info)}
.tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.info{background:var(--info-bg);color:var(--info)} .tag.soft{background:var(--soft);color:var(--graph)}
.tag.yel{background:var(--yel-bg);color:var(--yel-ink)}
.btn{height:48px;border:none;border-radius:16px;padding:0 16px;font-weight:700;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.yellow{background:var(--yellow);color:var(--ink);font-weight:800} .btn.green{background:var(--ok)} .btn.graph{background:var(--graph)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.sm{height:36px;border-radius:12px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.iconbtn{width:46px;height:46px;border-radius:16px;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scope{height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
/* світло по під’їздх */
.lightc{background:var(--card);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px}
.secs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sec{display:flex;flex-direction:column;align-items:center;gap:8px}
.col{width:100%;height:104px;border-radius:14px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;transition:background .3s}
.col.on{background:repeating-linear-gradient(180deg,#F2C12E 0 16px,#DFAE1C 16px 18px)}
.col.off{background:repeating-linear-gradient(180deg,#4A4F57 0 16px,#3F444B 16px 18px)}
.col.unknown{background:repeating-linear-gradient(180deg,#D5D9DE 0 16px,#C6CBD1 16px 18px)}
.col.me{outline:2.5px solid var(--ink);outline-offset:3px}
.sec .lb{font-size:12px;font-weight:600;color:var(--muted)} .sec.me .lb{font-weight:800;color:var(--ink)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px} .legend i{width:10px;height:10px;border-radius:3px;display:block}
.mark{background:var(--bg);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mark .btn{background:var(--card);color:var(--ink)}
.mark .btn.pon{background:var(--yellow)} .mark .btn.poff{background:var(--graph);color:#fff}
.sec .age{font-size:11px;font-weight:500;color:var(--muted);margin-top:-6px}
.col{position:relative}
.pend{position:absolute;top:7px;right:7px;width:12px;height:12px;border-radius:6px;border:2px solid #fff;box-sizing:border-box}
.pend.on{background:#F2C12E} .pend.off{background:#4A4F57}
.legend .pdot{background:linear-gradient(90deg,#F2C12E 50%,#4A4F57 50%);border-radius:6px}
.pendbox{background:var(--yel-bg);color:var(--yel-ink);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;line-height:1.4}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.input{height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--card);padding:0 14px;color:var(--ink);font-size:15px}
textarea.input{height:96px;padding:12px 14px;resize:none;line-height:1.4}
.note{background:var(--info-bg);color:var(--info);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 8px}
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;background:var(--card);border-radius:26px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;box-shadow:0 6px 24px rgba(35,38,43,.10)}
nav.tabs button{height:54px;border:none;border-radius:20px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button.on{background:var(--yellow);color:var(--ink);font-weight:800}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:9;max-width:90%;text-align:center}
.skel{background:linear-gradient(90deg,#E3E6EA,#EEF0F2,#E3E6EA);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:20px}
@keyframes sk{to{background-position:-200% 0}}
.center{min-height:86vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px}
.facade{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:8px}
.facade i{display:block;height:36px;border-radius:6px}
.dark{background:var(--ink);color:#fff}
.lifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lift{height:44px;border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px}
.lift i{width:8px;height:8px;border-radius:4px;display:block}
.lift.ok{background:var(--ok-bg);color:var(--ok)} .lift.ok i{background:var(--ok)}
.lift.bad{background:var(--bad-bg);color:var(--bad)} .lift.bad i{background:#C4302A}
.chatbtn{height:36px;padding:0 12px;border-radius:18px;border:none;background:var(--card);color:var(--ink);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.admin-line{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.admin-line:last-child{border-bottom:none}
.mem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:none}
.av{width:40px;height:40px;border-radius:20px;background:var(--line);color:var(--ink);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.av.y{background:var(--yellow)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slots i{display:block;height:6px;border-radius:3px;background:var(--line2)} .slots i.f{background:var(--yellow)} .slots i.p{background:var(--grey)}
.invite{background:var(--yel-bg);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.invite code{font-size:13px;word-break:break-all;color:var(--yel-ink);font-family:inherit;font-weight:700}
a{color:var(--graph)}

/* ===== Apple-шар (скилл apple-design) =====
   §1 відгук на натискання · §3-4 пружини (damping 1.0) · §7 просторова узгодженість
   §12 матеріали і глибина · §14 reduced motion / transparency / contrast · §15 типографіка */
:root{
  --spring:cubic-bezier(.22,1,.36,1);
  --press:100ms;
  --glass:rgba(255,255,255,.72);
  --shadow-1:0 1px 2px rgba(35,38,43,.05);
  --shadow-2:0 1px 2px rgba(35,38,43,.05),0 8px 24px rgba(35,38,43,.07);
  --shadow-3:0 2px 4px rgba(35,38,43,.06),0 14px 36px rgba(35,38,43,.14);
}

/* типографіка: великий текст стискаємо, дрібний трохи розкриваємо */
.h1{font-weight:700;font-size:1.625rem;line-height:1.08;letter-spacing:-.022em;text-wrap:balance}
.h2{font-weight:700;font-size:1.3125rem;line-height:1.15;letter-spacing:-.016em;text-wrap:balance}
.label{font-weight:600;letter-spacing:.07em}
.sub,.tile .k,.tag,.legend,.sec .lb,.sec .age{letter-spacing:.01em}

/* §1 відгук одразу на дотик, повернення пружиною */
button,a.iconbtn,.card[onclick]{touch-action:manipulation;transition:transform 380ms var(--spring),background-color 160ms ease,color 160ms ease,border-color 160ms ease,opacity 160ms ease}
button:active,a.iconbtn:active{transform:scale(.97);transition-duration:var(--press),160ms,160ms,160ms,160ms}
.card[onclick]:active{transform:scale(.985);transition-duration:var(--press),160ms,160ms,160ms,160ms}
button:disabled:active{transform:none}
nav.tabs button:active{transform:scale(.94)}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.input:focus{border-color:var(--graph);outline:none;box-shadow:0 0 0 3px rgba(242,193,46,.45)}

/* §12 глибина: чим більша поверхня, тим глибша тінь */
.card{box-shadow:var(--shadow-1)}
.card.dark{box-shadow:var(--shadow-2)}
.lightc{box-shadow:var(--shadow-2);border-radius:28px}

/* §12 нижня панель як скляний матеріал, контент ковзає під нею */
nav.tabs{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:var(--shadow-3),inset 0 0 0 1px rgba(255,255,255,.55),inset 0 1px 0 rgba(255,255,255,.9);z-index:5;isolation:isolate}
nav.tabs button{position:relative;z-index:1;color:var(--graph);font-weight:600;letter-spacing:.01em}
nav.tabs button.on{background:transparent;color:var(--ink);font-weight:700}
nav.tabs .pill{position:absolute;z-index:0;top:8px;bottom:8px;left:8px;width:calc((100% - 28px) / 4);border-radius:20px;background:var(--yellow);transform:translateX(calc(var(--i,0) * (100% + 4px)));transition:transform 420ms var(--spring)}
/* §12 замість жорсткої межі: м'яке згасання знизу там, де плаваюча панель накладається на контент */
.edge{position:fixed;left:0;right:0;bottom:0;height:calc(100px + env(safe-area-inset-bottom));pointer-events:none;z-index:4;background:linear-gradient(to top,rgba(242,243,245,.94),rgba(242,243,245,0));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(to top,#000 45%,transparent);mask-image:linear-gradient(to top,#000 45%,transparent)}

/* §7 екрани: вхід і вихід тим самим шляхом. Вперед справа, назад зліва, вкладки без зсуву */
@keyframes enter-r{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes enter-l{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes enter-f{from{opacity:0}to{opacity:1}}
@keyframes fade-out{to{opacity:0}}
.screen.in-push{animation:enter-r 420ms var(--spring) backwards}
.screen.in-pop{animation:enter-l 420ms var(--spring) backwards}
.screen.in-tab{animation:enter-f 220ms ease-out backwards}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in-push .bar>i,.in-pop .bar>i,.in-tab .bar>i{transform-origin:left;animation:grow 600ms var(--spring) 80ms backwards}

/* зміна статусу світла в секції: колонка «осідає» */
@keyframes settle{from{transform:scale(.93);filter:brightness(1.1)}to{transform:none;filter:none}}
.col.changed{animation:settle 520ms var(--spring)}

/* тост матеріалізується (розмиття і масштаб разом), а не просто з'являється */
.toast{background:rgba(35,38,43,.84);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--shadow-3);letter-spacing:.005em;animation:mat-in 380ms var(--spring) backwards}
.toast.out{animation:mat-out 200ms ease-in forwards}
@keyframes mat-in{from{opacity:0;filter:blur(10px);transform:translateX(-50%) translateY(10px) scale(.94)}to{opacity:1;filter:none;transform:translateX(-50%)}}
@keyframes mat-out{to{opacity:0;filter:blur(8px);transform:translateX(-50%) scale(.96)}}

/* §14 зменшений рух: перехід через прозорість замість зсувів і пружин */
@media (prefers-reduced-motion:reduce){
  .screen.in-push,.screen.in-pop{animation:enter-f 200ms ease-out backwards}
  .in-push .bar>i,.in-pop .bar>i,.in-tab .bar>i{animation:none}
  .col.changed{animation:none}
  .toast{animation:enter-f 200ms ease-out backwards}
  .toast.out{animation:fade-out 150ms ease-in forwards}
  nav.tabs .pill{transition:none}
  button:active,a.iconbtn:active,.card[onclick]:active,nav.tabs button:active{transform:none;opacity:.7}
}
@media (prefers-reduced-transparency:reduce){
  nav.tabs{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
  .edge{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(to top,var(--bg),rgba(242,243,245,0))}
  .toast{background:var(--ink);-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-contrast:more){
  nav.tabs{background:#fff;box-shadow:var(--shadow-3),inset 0 0 0 1.5px var(--graph)}
  .card{box-shadow:inset 0 0 0 1px var(--line2)}
  .sub,.tile .k{color:var(--ink)}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toast"></div>
<div class="edge" aria-hidden="true"></div>

<script>
// ===== НАЛАШТУВАННЯ =====
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwZusNukQJGfcCYb0bNezcIblO2jTyeeixw_vY1DfL0Q0Dyq79y_-4UGUJPuOYzasYW/exec',
  BOT_USERNAME: 'rusanivgavanbot',          // без @
  GROUP: '4422230766',                      // ID групи без -100
  // ID тем групи (число з посилання t.me/c/4422230766/ЧИСЛО/...). 0 = відкриється просто група
  TOPICS: { general: 1 }
};
// =======================

const tg = window.Telegram && window.Telegram.WebApp;
const DEMO = /[?&]demo=1/.test(location.search);
const $app = document.getElementById('app');
let D = null;
let route = 'home';
let stack = [];
let busy = false;
const ui = { all: false, ptab: 'open', form: { cat: 'Ліфт', whole: false, place: '', text: '' }, poll: { q: '', opts: '', owners: true, multi: false }, urgent: { text: '', ent: 0 }, lsec: 0, sel: {}, editing: {}, invite: '' };
try { ui.all = localStorage.getItem('b8n_all') === '1'; } catch (e) {}

const ICON = {
  home: '<path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  tool: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  vote: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  user: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.18 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  bulb: '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/>',
  nobulb: '<path d="M3 3l18 18"/><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8.2 4.6A7 7 0 0 1 19 9c0 1.5-.5 2.9-1.4 4"/><path d="M8.5 14.5c.4.5.5 1 .5 1.5h6"/>',
  swap: '<path d="M7 16V4"/><path d="M3 8l4-4 4 4"/><path d="M17 8v12"/><path d="M21 16l-4 4-4-4"/>',
  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  share: '<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>'
};
function ic(name, color, size) {
  return '<svg width="' + (size || 22) + '" height="' + (size || 22) + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
}
function openChat(key) {
  if (!CONFIG.GROUP) { toast('Посилання на чат ще не налаштовано'); return; }
  const t = CONFIG.TOPICS[key];
  const url = 'https://t.me/c/' + CONFIG.GROUP + (t ? '/' + t : '');
  haptic();
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
}
function chatBtn(key, label) {
  return '<button class="chatbtn" onclick="openChat(\'' + key + '\')">' + ic('chat', '#23262B', 16) + esc(label) + '</button>';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function ago(t) {
  if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'щойно';
  if (m < 60) return m + ' хв тому';
  const d = new Date(t), n = new Date();
  const hm = d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === n.toDateString()) return 'сьогодні, ' + hm;
  const y = new Date(n); y.setDate(n.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'вчора, ' + hm;
  return d.toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' });
}
function haptic(type) { try { tg && tg.HapticFeedback && (type === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred('light')); } catch (e) {} }
function toast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toast.t); clearTimeout(toast.t2);
  toast.t = setTimeout(() => {
    const t = el.firstChild; if (t) t.classList.add('out');
    toast.t2 = setTimeout(() => { el.innerHTML = ''; }, 200);
  }, 2600);
}
function entName(e) { return e ? 'Під’їзд ' + e : 'Весь будинок'; }
function visible(e) { return ui.all || !e || !D.me.entrance || e === D.me.entrance; }
function isOwner() { return /власн/.test(D.me.role || ''); }
function isFamily() { return !!D.me.family; }
function initials(n) { return String(n || '?').split(' ').filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?'; }
function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
function plural(n, a, b, c) { n = Math.abs(n) % 100; const m = n % 10; if (n > 10 && n < 20) return c; if (m > 1 && m < 5) return b; if (m === 1) return a; return c; }
function ask(q, cb) { if (tg && tg.showConfirm && tg.initData) tg.showConfirm(q, cb); else cb(window.confirm(q)); }

// ---------- сервер ----------
async function api(action, data) {
  if (DEMO) return demoApi(action, data || {});
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action, initData: tg ? tg.initData : '' }, data || {}))
  });
  const j = await res.json();
  if (j.error) throw new Error(j.error);
  return j;
}
async function run(action, data, okMsg) {
  if (busy) return false;
  busy = true;
  try {
    D = await api(action, data);
    save();
    if (okMsg) { toast(okMsg); haptic('ok'); }
    render();
    return true;
  } catch (e) {
    toast(e.message || 'Помилка, спробуйте ще раз');
    return false;
  } finally { busy = false; }
}
function save() { try { const c = Object.assign({}, D); delete c.invite; localStorage.setItem('b8n_cache', JSON.stringify(c)); } catch (e) {} }

// ---------- навігація ----------
function go(r) {
  if (['new', 'useful', 'admin'].indexOf(r) >= 0) { stack.push(route); ui.anim = 'push'; }
  else { stack = []; ui.anim = r === route ? '' : 'tab'; }
  route = r; render(); window.scrollTo(0, 0);
}
function back() { route = stack.pop() || 'home'; ui.anim = 'pop'; render(); window.scrollTo(0, 0); }
function syncBack() {
  if (!tg || !tg.BackButton) return;
  if (stack.length) tg.BackButton.show(); else tg.BackButton.hide();
}

// ---------- екрани ----------
function render() {
  if (!D) { $app.innerHTML = skeleton(); return; }
  if (D.me.state !== 'accepted' && !D.me.isAdmin) { $app.innerHTML = gate(); return; }
  const s = { home: home, problems: problems, polls: polls, me: cabinet, new: newProblem, useful: useful, admin: admin }[route] || home;
  let scr = document.getElementById('scr');
  if (!scr) { $app.innerHTML = '<div class="screen" id="scr"></div>' + tabs(); scr = document.getElementById('scr'); }
  const anim = ui.anim; ui.anim = '';
  scr.className = 'screen';
  scr.innerHTML = s();
  if (anim) { void scr.offsetWidth; scr.className = 'screen in-' + anim; }
  setNav();
  syncBack();
}

function skeleton() {

}

function facade() {

  const st = D.me.state;

  const text = st === 'pending' ? 'Адміністратор перевіряє вашу заявку. Щойно підтвердить, застосунок відкриється.'
    : st === 'rejected' ? 'Якщо це помилка, напишіть адміністратору або пройдіть реєстрацію ще раз.'

const TAB_KEYS = ['home', 'problems', 'polls', 'me'];
function tabCur() { return { new: 'problems', useful: 'home', admin: 'me' }[route] || route; }
function tabs() {

function setNav() {

function scopeBtn() {

// ---------- світло по під’їздх ----------
function shortAgo(t) {
  if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'щойно';
  if (m < 60) return m + ' хв';
  const h = Math.round(m / 60);
  return h < 24 ? h + ' год' : Math.round(h / 24) + ' д';
}
function sinceTxt(t) {
  if (!t) return '';
  const d = new Date(t), n = new Date();
  const hm = d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === n.toDateString()) return 'з ' + hm;
  const y = new Date(n); y.setDate(n.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'з учора, ' + hm;
  return 'з ' + d.toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' }) + ', ' + hm;
}
function lightCard() {
  const L = (D.light && D.light.sections) || {};
  const me = D.me, n = D.entrances || 4;
  let on = 0, known = 0;
  const nextLight = {};
  const cols = [];
  for (let s = 1; s <= n; s++) {
    const x = L[s] || { status: 'unknown' };
    if (x.status === 'on') on++;
    if (x.status !== 'unknown') known++;
    const isMe = s === me.entrance;
    const prevSt = ui.prevLight && ui.prevLight[s];
    const chg = !!prevSt && prevSt !== x.status;
    nextLight[s] = x.status;
    const word = x.status === 'on' ? 'світло є' : x.status === 'off' ? 'світла немає' : 'ще не відмічали';
    cols.push('<div class="sec' + (isMe ? ' me' : '') + '"><div class="col ' + x.status + (isMe ? ' me' : '') + (chg ? ' changed' : '') + '" role="img" aria-label="Під’їзд ' + s + ': ' + word + '">' +
      (x.pending ? '<i class="pend ' + x.pending.dir + '" title="очікує підтвердження"></i>' : '') +
      (x.status === 'on' ? ic('bulb', '#23262B', 20) : x.status === 'off' ? ic('nobulb', '#C6CBD1', 18) : '') + '</div>' +
      '<span class="lb">Під. ' + s + '</span><span class="age">' + (x.status === 'unknown' ? '—' : shortAgo(x.at)) + '</span></div>');
  }
  ui.prevLight = nextLight;
  const title = known ? on + ' з ' + n + ' під’їздів зі світлом' : 'Поки невідомо';
  let h = '<div class="lightc"><div style="display:flex;flex-direction:column;gap:4px"><div class="label">Світло в будинку</div><div class="h2">' + title + '</div></div>' +
    '<div class="secs">' + cols.join('') + '</div>' +
    '<div class="legend"><span><i style="background:#F2C12E"></i>є світло</span><span><i style="background:#4A4F57"></i>немає</span><span><i style="background:#D5D9DE"></i>ще не відмічали</span><span><i class="pdot"></i>чекає підтвердження</span></div>';
  if (me.entrance) {
    const my = L[me.entrance] || { status: 'unknown' };
    const mine = ui.myLight || (D.light && D.light.mine);
    let sub;
    if (my.status === 'unknown') sub = 'Ще ніхто не відмітився. Будьте першим!';
    else sub = (my.status === 'on' ? 'Світло є ' : 'Світла немає ') + sinceTxt(my.since) + ' · ' +
      (my.by === 'admin' ? 'оновив адміністратор ' + ago(my.at) : 'підтверджено ' + ago(my.at));
    let pend = '';
    if (my.pending) {
      const pw = my.pending.dir === 'on' ? '«світло є»' : '«світла немає»';
      pend = '<div class="pendbox">' + (mine === my.pending.dir
        ? 'Вашу відмітку ' + pw + ' враховано. Статус зміниться, щойно це підтвердить ще одна квартира.'
        : 'Сусід ' + ago(my.pending.at) + ' відмітив ' + pw + '. Якщо у вас так само — натисніть, і статус зміниться.') + '</div>';
    }
    h += '<div class="mark"><div style="font-size:14px">Як у вас у <b>під’їзді ' + me.entrance + '</b> зараз?</div>' +
      '<div class="grid2"><button class="btn' + (mine === 'on' ? ' pon' : '') + '" onclick="markLight(true)">' + ic('bulb', null, 18) + 'Світло є</button>' +
      '<button class="btn' + (mine === 'off' ? ' poff' : '') + '" onclick="markLight(false)">' + ic('nobulb', null, 18) + 'Нема</button></div>' +
      '<div class="sub" style="font-weight:500">' + esc(sub) + '</div>' + pend + '</div>';
  }
  return h + '</div>';
}
function markLight(on) { ui.myLight = on ? 'on' : 'off'; haptic(); run('light', { on: on }, 'Дякуємо, відмітку враховано'); }

function home() {
  const me = D.me;
  const st = D.statuses.filter(s => !isLift(s) && (!s.entrance || s.entrance === me.entrance));
  const myLifts = D.statuses.filter(s => isLift(s) && me.entrance && s.entrance === me.entrance);
  const liftCard = myLifts.length ? '<div class="card"><div class="row"><span style="font-weight:700">Ліфти · під’їзд ' + me.entrance + '</span><span class="sub" style="font-weight:500">зелений — працює</span></div><div class="lifts">' +

  ).sort((a, b) => b.t - a.t).slice(0, 5);
  return '<div class="row"><div><div class="sub">' + (me.entrance ? 'Під’їзд ' + me.entrance + ' · ' : '') + (me.apt ? 'кв. ' + esc(me.apt) : 'адміністратор') + '</div><div class="h1">8 будинок</div></div>' +
    '<button class="iconbtn" aria-label="Корисне" onclick="go(\'useful\')">' + ic('phone', '#23262B', 20) + '</button></div>' +
    confirmCards() + lightCard() +
    (tiles ? '<div class="grid3">' + tiles + '</div>' : '') + liftCard +
    '<div class="row"><div style="font-size:16px;font-weight:700">Що відбувається</div>' + scopeBtn() + '</div>' +
    (feed.length ? feed.map(f => f.html).join('') : '<div class="empty">Усе спокійно</div>') +

    '<div class="chips">' + chatBtn('general', 'Чат будинку') + '</div>';
}

    '<div class="sub" style="font-weight:500;margin-top:4px">' + ago(p.created) + (p.own ? ' · ваша заявка' : '') + (D.me.isAdmin && p.authorApt ? ' · від кв. ' + esc(p.authorApt) + (/член/.test(p.authorRole || '') ? ' (член сімʼї)' : '') : '') + '</div>' +
    (p.confirm === 'підтверджено' ? '<div style="font-size:13px;font-weight:700;color:var(--ok);margin-top:4px">✓ Мешканець підтвердив, що вирішено</div>'

    '<div class="bar"><i style="width:' + pct + '%;background:' + (tone === 'ok' ? 'var(--ok)' : 'var(--yellow-d)') + '"></i></div>' +

  const open = list.filter(p => p.open), closed = list.filter(p => !p.open);
  return '<div class="h1">Голосування</div>' +
    (open.length ? open.map(pollCard).join('') : '<div class="empty">Активних опитувань немає</div>') +
    (closed.length ? '<div class="label">Завершені</div>' + closed.map(pollCard).join('') : '');
}
function canVoteIn(p) { return p.open && (!p.ownersOnly || isOwner()) && D.me.apt && !isFamily(); }
function noVoteNote(p) {
  if (!p.open) return '';
  if (isFamily()) return '<div class="note">Члени сімʼї бачать результати. Голосує власник або орендар квартири.</div>';
  if (p.ownersOnly && !isOwner()) return '<div class="note">Голосують власники. Ви бачите результати.</div>';
  return '';
}
function shortOpt(o) { return String(o).replace(/:00/g, ''); }
function multiPollCard(p) {
  const canVote = canVoteIn(p);
  const editing = canVote && (!p.voted || ui.editing[p.id]);
  if (editing && !ui.sel[p.id]) ui.sel[p.id] = (p.voted || []).slice();
  const sel = ui.sel[p.id] || [];
  const max = Math.max.apply(null, p.counts.concat([1]));
  const top = p.counts.map((c, i) => [c, i]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 3).map(x => x[1]);
  let h = '<div class="card" style="gap:12px;padding:18px;border-radius:24px"><div class="row"><span class="tag ' + (p.open ? 'yel' : 'soft') + '">' + (p.open ? 'Триває' : 'Завершено') + '</span><span class="sub" style="font-weight:500">можна обрати кілька</span></div>' +
    '<div style="font-size:19px;font-weight:800;line-height:1.3;letter-spacing:-.01em">' + esc(p.question) + '</div>';
  if (editing) {
    h += '<div class="sub">Позначте всі зручні для вас варіанти</div><div class="grid3">' +
      p.options.map((o, i) => '<button class="chip' + (sel.indexOf(o) >= 0 ? ' on' : '') + '" style="height:42px;padding:0 4px" onclick="pickMulti(' + p.id + ',' + i + ')">' + esc(shortOpt(o)) + '</button>').join('') + '</div>' +
      '<div class="row" style="gap:8px"><button class="btn yellow" style="flex:1" onclick="saveMulti(' + p.id + ')"' + (sel.length ? '' : ' disabled') + '>Зберегти' + (sel.length ? ' (' + sel.length + ')' : '') + '</button>' +
      (p.voted ? '<button class="btn ghost" onclick="ui.editing[' + p.id + ']=false;ui.sel[' + p.id + ']=null;render()">Скасувати</button>' : '') + '</div>';
  } else if (p.voted) {
    h += '<div style="background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.45">Вибір квартири: ' + p.voted.map(shortOpt).map(esc).join(', ') + '</div>' +
      (canVote ? '<button class="btn sm ghost" style="align-self:flex-start" onclick="ui.editing[' + p.id + ']=true;render()">Змінити вибір</button>' : '');
  } else h += noVoteNote(p);
  if (!editing || D.me.isAdmin) {
    h += '<div class="row sub"><span>Проголосувало квартир</span><span>' + p.total + '</span></div>';
    if (top.length) h += '<div style="font-size:14px;font-weight:700">Найпопулярніші: ' + top.map(i => esc(shortOpt(p.options[i]))).join(', ') + '</div>';
    h += '<div style="display:flex;flex-direction:column;gap:5px">' + p.options.map((o, i) => {
      const w = Math.round(p.counts[i] / max * 100);
      return '<div style="display:grid;grid-template-columns:62px 1fr 32px;align-items:center;gap:8px;font-size:13px;font-weight:600"><span>' + esc(shortOpt(o)) + '</span>' +
        '<div class="bar" style="height:10px"><i style="width:' + w + '%;background:' + (top.indexOf(i) >= 0 ? 'var(--yellow-d)' : 'var(--graph)') + '"></i></div><span style="text-align:right">' + p.counts[i] + '</span></div>';
    }).join('') + '</div>';
  }
  return h + adminPollBtns(p) + '</div>';
}
function adminPollBtns(p) {
  if (!D.me.isAdmin) return '';
  return '<div class="row" style="justify-content:flex-start;gap:8px">' +
    (p.open ? '<button class="btn sm ghost" onclick="run(\'closePoll\',{id:' + p.id + '},\'Опитування завершено\')">Завершити</button>' : '') +
    '<button class="btn sm ghost" style="color:var(--bad)" onclick="delPoll(' + p.id + ')">Видалити</button></div>';
}
function pickMulti(id, i) {
  const p = D.polls.find(x => x.id === id); const o = p.options[i];
  const s = ui.sel[id] || (ui.sel[id] = []);
  const k = s.indexOf(o); if (k >= 0) s.splice(k, 1); else s.push(o);
  haptic(); render();
}
async function saveMulti(id) {
  const s = ui.sel[id] || [];
  if (!s.length) return;
  if (await run('vote', { id: id, options: s }, 'Вибір збережено')) { ui.sel[id] = null; ui.editing[id] = false; render(); }
}
function pollCard(p) {
  if (p.multi) return multiPollCard(p);
  const canVote = canVoteIn(p);
  const showRes = !p.open || p.voted || !canVote || D.me.isAdmin;
  const colors = ['var(--ok)', 'var(--yellow-d)', 'var(--grey)', 'var(--graph)', '#8A6D00'];
  let h = '<div class="card" style="gap:12px;padding:18px;border-radius:24px"><div class="row"><span class="tag ' + (p.open ? 'yel' : 'soft') + '">' + (p.open ? 'Триває' : 'Завершено') + '</span><span class="sub" style="font-weight:500">1 квартира = 1 голос</span></div>' +
    '<div style="font-size:19px;font-weight:800;line-height:1.3;letter-spacing:-.01em">' + esc(p.question) + '</div>';
  if (showRes) {
    h += '<div class="row sub"><span>Проголосувало квартир</span><span>' + p.total + '</span></div>';
    h += p.options.map((o, i) => {
      const pct = p.total ? Math.round(p.counts[i] / p.total * 100) : 0;
      return '<div style="display:flex;flex-direction:column;gap:4px"><div class="row" style="font-size:14px;font-weight:600"><span>' + esc(o) + (p.voted === o ? ' · голос квартири' : '') + '</span><span>' + p.counts[i] + ' (' + pct + '%)</span></div><div class="bar" style="height:8px"><i style="width:' + pct + '%;background:' + colors[i % colors.length] + '"></i></div></div>';
    }).join('');
  }
  if (canVote) {
    h += '<div style="display:flex;flex-direction:column;gap:8px">' + (p.voted ? '<div class="sub">Змінити голос:</div>' : '') +
      p.options.map(o => '<button class="btn ' + (p.voted === o ? 'yellow' : 'ghost') + '" onclick="vote(' + p.id + ',this.dataset.o)" data-o="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  } else h += noVoteNote(p);
  h += adminPollBtns(p);
  h += '<div style="font-size:12px;color:var(--muted);line-height:1.45">Це опитування для оцінки думки мешканців, не офіційне голосування ОСББ.</div>';
  return h + '</div>';
}
function delPoll(id) {
  ask('Видалити опитування разом з усіма голосами? Це не можна скасувати.', ok => { if (ok) run('deletePoll', { id: id }, 'Опитування видалено'); });

function vote(id, o) { haptic(); run('vote', { id: id, option: o }, 'Голос враховано'); }

    '<textarea class="input" style="height:90px" placeholder="Варіанти, кожен з нового рядка" oninput="ui.poll.opts=this.value">' + esc(pl.opts) + '</textarea>' +
    '<label style="display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" ' + (pl.multi ? 'checked' : '') + ' onchange="ui.poll.multi=this.checked" style="width:20px;height:20px;accent-color:#4A4F57">Можна обрати кілька варіантів</label>' +
    '<label style="display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" ' + (pl.owners ? 'checked' : '') + ' onchange="ui.poll.owners=this.checked" style="width:20px;height:20px;accent-color:#4A4F57">Голосують лише власники</label>' +
    '<button class="btn graph" onclick="sendPoll()">Створити опитування</button></div>';
}
async function sendUrgent() {
  if (!ui.urgent.text.trim()) { toast('Напишіть текст'); return; }
  if (await run('urgent', { text: ui.urgent.text, entrance: ui.urgent.ent }, 'Надіслано')) { ui.urgent.text = ''; render(); }
}
async function sendPoll() {
  const opts = ui.poll.opts.split('\n').map(s => s.trim()).filter(Boolean);
  if (!ui.poll.q.trim() || opts.length < 2) { toast('Потрібне питання і мінімум 2 варіанти'); return; }
  if (await run('newPoll', { question: ui.poll.q, options: opts, ownersOnly: ui.poll.owners, multi: ui.poll.multi }, 'Опитування створено')) { ui.poll = { q: '', opts: '', owners: true, multi: false }; render(); }
}
function genTemplate() {
  const p = n => ('0' + (n % 24)).slice(-2) + ':00';
  const hours = []; for (let h = 7; h <= 23; h++) hours.push(p(h) + '–' + p(h + 1));
  ui.poll = { q: 'У які години для вас найважливіше, щоб працював генератор?', opts: hours.join('\n'), owners: false, multi: true };
  haptic(); render();
}

// ---------- старт ----------
async function start() {
  if (tg) {
    try {
      tg.ready(); tg.expand();
      tg.setHeaderColor && tg.setHeaderColor('#F2F3F5');
      tg.setBackgroundColor && tg.setBackgroundColor('#F2F3F5');
      tg.BackButton && tg.BackButton.onClick(back);
    } catch (e) {}
  }
  if (!DEMO && (!tg || !tg.initData)) {
    $app.innerHTML = '<div class="center">' + facade() + '<div class="h2">Відкрийте в Telegram</div><div style="color:var(--muted)">Цей застосунок працює всередині Telegram.</div></div>';
    return;
  }
  if (!DEMO) { try { const c = localStorage.getItem('b8n_cache'); if (c) D = JSON.parse(c); } catch (e) {} }
  render();
  try { D = await api('load'); save(); render(); }
  catch (e) {
    if (!D) $app.innerHTML = '<div class="center"><div class="h2">Не вдалося завантажити</div><div style="color:var(--muted)">' + esc(e.message) + '</div><button class="btn" onclick="location.reload()">Спробувати ще</button></div>';
    else toast('Немає звʼязку, показую збережене');
  }
}

// ---------- демо-режим (?demo=1; &admin=1, &family=1, &state=pending) ----------
let DEMO_DB = null;
function demoApi(action, d) {
  const now = Date.now(), H = 3600000, q = location.search;
  if (!DEMO_DB) {
    const fam = /family=1/.test(q);
    const me = { id: fam ? 3 : 1, name: fam ? 'Андрій Коваль' : 'Олена Коваль', username: 'olena_k', apt: '76', entrance: 2, role: fam ? 'член сімʼї' : 'власник', family: fam,
      state: /state=(\w+)/.test(q) ? q.match(/state=(\w+)/)[1] : 'accepted', isAdmin: /admin=1/.test(q) };
    me.flat = { apt: '76', canManage: !fam, openInvites: fam ? 0 : 1, max: 3, left: fam ? 0 : 1,
      members: [{ id: 1, name: 'Олена Коваль', role: 'власник', family: false, isMe: !fam }, { id: 3, name: 'Андрій Коваль', role: 'член сімʼї', family: true, isMe: fam }] };
    if (fam) me.flat.members.reverse();
    me.flat = null;
    DEMO_DB = {
      me: me,
      statuses: [
        { row: 2, name: 'Гаряча вода', value: 'Є', tone: 'ok', entrance: 0, options: [{ value: 'Є', tone: 'ok' }, { value: 'Немає', tone: 'bad' }, { value: 'Ремонт', tone: 'bad' }] },
        { row: 3, name: 'Холодна вода', value: 'Є', tone: 'ok', entrance: 0, options: [{ value: 'Є', tone: 'ok' }, { value: 'Немає', tone: 'bad' }] },
        { row: 4, name: 'Опалення', value: 'Пуск', tone: 'info', entrance: 0, options: [{ value: 'Є', tone: 'ok' }, { value: 'Немає', tone: 'bad' }, { value: 'Пуск', tone: 'info' }] }
      ].concat([1, 2, 3, 4].reduce((a, e) => a.concat(['лівий', 'правий', 'вантажний'].map((n, k) => {
        const bad = (e === 2 && k === 2);
        return { row: 10 + e * 3 + k, name: 'Ліфт ' + n, value: bad ? 'Не працює' : 'Працює', tone: bad ? 'bad' : 'ok', entrance: e, options: [{ value: 'Працює', tone: 'ok' }, { value: 'Не працює', tone: 'bad' }] };
      })), [])),
      light: { sections: { 1: { status: 'on', since: now - 26 * H, at: now - 6 * 60000, by: 'neighbors' }, 2: { status: 'on', since: now - 3 * H, at: now - 4 * 60000, by: 'neighbors' }, 3: { status: 'off', since: now - 2 * H, at: now - 40 * 60000, by: 'neighbors', pending: { dir: 'on', at: now - 3 * 60000 } }, 4: { status: 'unknown', since: 0, at: 0 } }, mine: null },
      problems: [
        { id: 14, created: now - 2 * H, entrance: 2, category: 'Ліфт', place: 'вантажний', text: 'Зупиняється між 7 і 8 поверхом', status: 'В роботі', count: 8, mine: false, own: false, authorApt: '301', authorRole: 'власник' },
        { id: 13, created: now - 5 * H, entrance: 0, category: 'Вода', place: '', text: 'Слабкий тиск холодної води вечорами', status: 'Нова', count: 23, mine: true, own: false, authorApt: '12', authorRole: 'член сімʼї' },
        { id: 9, created: now - 140 * H, entrance: 2, category: 'Світло в під’їзді', place: '26 поверх', text: 'Не світить лампа на сходах', status: 'Вирішено', count: 3, mine: false, own: true, authorApt: '76', confirm: '' }
      ],
      news: [{ time: now - 3 * H, entrance: 0, text: 'У пʼятницю 10:00–14:00 планове відключення холодної води' }],
      polls: [
        { id: 2, question: 'Чи підтримуєте ви створення ОСББ у нашому будинку?', options: ['Так, за', 'Ні', 'Ще не визначився'], counts: [61, 9, 13], open: true, ownersOnly: true, voted: null, total: 83 },
        { id: 1, question: 'Зручний час для зборів', options: ['Субота, 12:00', 'Неділя, 18:00'], counts: [96, 52], open: false, ownersOnly: false, voted: 'Субота, 12:00', total: 148 }
      ],
      useful: [
        { section: 'Тривога і відключення', name: 'Укриття', desc: '[Де саме, вхід з якого під’їзду]', phone: '' },
        { section: 'Тривога і відключення', name: 'Пункт незламності', desc: '[Найближча адреса]', phone: '' },
        { section: 'Контакти', name: 'Аварійна служба УК', desc: 'цілодобово', phone: '[номер]' },
        { section: 'Контакти', name: 'Гаряча лінія міста', desc: 'скарги на комунальні служби', phone: '1551' }
      ],
      totalApts: 566, entrances: 4, now: now
    };
  }
  const db = DEMO_DB;
  delete db.invite;
  const L = db.light.sections;
  if (action === 'light') { const s = L[db.me.entrance], dd = d.on ? 'on' : 'off'; db.light.mine = dd; if (s.status === 'unknown' || s.status === dd) { s.status = dd; s.at = now; if (!s.since) s.since = now; delete s.pending; } else if (s.pending && s.pending.dir === dd) { s.status = dd; s.since = now; s.at = now; s.by = 'neighbors'; delete s.pending; } else s.pending = { dir: dd, at: now }; }
  if (action === 'metoo') { const p = db.problems.find(x => x.id === d.id); p.mine = !p.mine; p.count += p.mine ? 1 : -1; }
  if (action === 'newProblem') db.problems.unshift({ id: 15, created: now, entrance: d.wholeHouse ? 0 : 2, category: d.category, place: d.place, text: d.text, status: 'Нова', count: 1, mine: false, own: true, authorApt: '76' });
  if (action === 'vote' && d.options) { const p = db.polls.find(x => x.id === d.id); if (p.voted) p.voted.forEach(o => p.counts[p.options.indexOf(o)]--); else p.total++; p.voted = p.options.filter(o => d.options.indexOf(o) >= 0); p.voted.forEach(o => p.counts[p.options.indexOf(o)]++); }
  else if (action === 'vote') { const p = db.polls.find(x => x.id === d.id); if (p.voted) { p.counts[p.options.indexOf(p.voted)]--; } else p.total++; p.voted = d.option; p.counts[p.options.indexOf(d.option)]++; }
  if (action === 'problemStatus') { const x = db.problems.find(y => y.id === d.id); x.status = d.status; if (d.status === 'Вирішено') x.confirm = ''; }
  if (action === 'confirmProblem') { const x = db.problems.find(y => y.id === d.id); if (d.ok) x.confirm = 'підтверджено'; else { x.status = 'В роботі'; x.confirm = 'не вирішено'; } }
  if (action === 'setStatus') { const s = db.statuses.find(x => x.row === d.row); s.value = d.value; s.tone = d.tone; }
  if (action === 'lightSet') [1, 2, 3, 4].forEach(n => { if (!d.section || d.section === n) L[n] = { status: d.on ? 'on' : 'off', since: now, at: now, by: 'admin' }; });
  if (action === 'urgent') db.news.unshift({ time: now, entrance: d.entrance, text: d.text });
  if (action === 'newPoll') db.polls.unshift({ id: 3, question: d.question, options: d.options, counts: d.options.map((_, i) => [3, 2, 4, 6, 5, 4, 3, 4, 5, 7, 9, 14, 18, 21, 19, 12, 6][i] || 0), open: true, ownersOnly: d.ownersOnly, multi: d.multi, voted: null, total: 31 });
  if (action === 'closePoll') db.polls.find(x => x.id === d.id).open = false;
  if (action === 'deletePoll') db.polls = db.polls.filter(x => x.id !== d.id);
  const f = db.me.flat;
  if (action === 'invite') { if (!f.left) return Promise.reject(new Error('На квартиру вже додано або запрошено 3 людини')); f.openInvites++; f.left--; db.invite = 'https://t.me/budynok10_bot?start=inv_' + Math.random().toString(16).slice(2, 14); }
  if (action === 'cancelInvites') { f.left += f.openInvites; f.openInvites = 0; }
  if (action === 'removeMember') { f.members = f.members.filter(m => m.id !== d.id); f.left++; }
  return new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify(db))), 250));
}

start();
