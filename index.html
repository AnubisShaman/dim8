<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>8 будинок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== НАЛАШТУВАННЯ — дивись також CONFIG у скрипті нижче ===== */
:root{
  --bg:#F2EFE9; --card:#FFFFFF; --ink:#16202E; --muted:#5B6472; --line:#E4DED3; --line2:#D9D2C5;
  --navy:#2A4A9B; --clay:#C4502A; --green:#1E5E45;
  --ok-bg:#DCEEE6; --ok:#1E5E45; --bad-bg:#F6DDD3; --bad:#8A2E12; --info-bg:#DFE6F5; --info:#233F86; --soft:#ECE7DE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:15px}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:14px}
.h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:24px;margin:0}
.h2{font-family:'Unbounded',sans-serif;font-weight:700;font-size:20px;margin:0}
.sub{font-size:13px;color:var(--muted);font-weight:600}
.label{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:15px;font-weight:700}
.t-ok{color:var(--ok)} .t-bad{color:var(--bad)} .t-info{color:var(--info)}
.tag{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.info{background:var(--info-bg);color:var(--info)} .tag.soft{background:var(--soft);color:#4A4F57}
.btn{height:46px;border:none;border-radius:14px;padding:0 16px;font-weight:700;background:var(--ink);color:#fff}
.btn.clay{background:var(--clay)} .btn.green{background:var(--green)} .btn.navy{background:var(--navy)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.sm{height:36px;border-radius:12px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.iconbtn{width:44px;height:44px;border-radius:22px;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scope{height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.light{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;color:#fff;transition:background .3s}
.light.on{background:var(--green)} .light.off{background:var(--ink)} .light.unknown{background:#4A5566}
.light .big{font-family:'Unbounded',sans-serif;font-size:28px;font-weight:700}
.light .b1{background:#fff;color:var(--ink)} .light .b2{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.light .btn.picked{outline:3px solid #FFD166;outline-offset:1px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.input{height:46px;border-radius:14px;border:1px solid var(--line2);background:var(--card);padding:0 14px;color:var(--ink);font-size:15px}
textarea.input{height:96px;padding:12px 14px;resize:none;line-height:1.4}
.note{background:var(--info-bg);color:var(--info);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{height:64px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs .wrap{max-width:520px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:9;max-width:90%;text-align:center}
.skel{background:linear-gradient(90deg,#E8E3DA,#F1ECE4,#E8E3DA);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:18px}
@keyframes sk{to{background-position:-200% 0}}
.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.dark{background:var(--ink);color:#fff}
.lifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lift{height:44px;border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px}
.lift i{width:8px;height:8px;border-radius:4px;display:block}
.lift.ok{background:var(--ok-bg);color:var(--ok)} .lift.ok i{background:var(--ok)}
.lift.bad{background:var(--bad-bg);color:var(--bad)} .lift.bad i{background:#C4302A}
.chatbtn{height:36px;padding:0 12px;border-radius:18px;border:none;background:var(--info-bg);color:var(--info);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.admin-line{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.admin-line:last-child{border-bottom:none}
a{color:var(--navy)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toast"></div>

<script>
// ===== НАЛАШТУВАННЯ =====
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwZusNukQJGfcCYb0bNezcIblO2jTyeeixw_vY1DfL0Q0Dyq79y_-4UGUJPuOYzasYW/exec', // https://script.google.com/macros/s/.../exec
  BOT_USERNAME: 'rusanivgavanbot',          // без @
  GROUP: '4422230766',                      // ID групи без -100
  // ID тем групи (число з посилання t.me/c/4422230766/ЧИСЛО/...). 0 = відкриється просто група
  TOPICS: { general: 1, reports: 0, lifts: 0, urgent: 0, receipts: 0, discuss: 0 }
};
// =======================

const tg = window.Telegram && window.Telegram.WebApp;
const DEMO = /[?&]demo=1/.test(location.search);
const $app = document.getElementById('app');
let D = null;               // усі дані з сервера
let route = 'home';
let stack = [];
let busy = false;
const ui = { all: false, ptab: 'open', form: { cat: 'Ліфт', whole: false, place: '', text: '' }, poll: { q: '', opts: '', owners: true }, urgent: { text: '', ent: 0 } };
try { ui.all = localStorage.getItem('b8_all') === '1'; } catch (e) {}

const ICON = {
  home: '<path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  tool: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  vote: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.18 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  bulb: '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/>',
  swap: '<path d="M7 16V4"/><path d="M3 8l4-4 4 4"/><path d="M17 8v12"/><path d="M21 16l-4 4-4-4"/>',
  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'
};
function ic(name, color, size) {
  return '<svg width="' + (size || 22) + '" height="' + (size || 22) + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
}
function openChat(key) {
  const t = CONFIG.TOPICS[key];
  const url = 'https://t.me/c/' + CONFIG.GROUP + (t ? '/' + t : '');
  haptic();
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
}
function chatBtn(key, label) {
  return '<button class="chatbtn" onclick="openChat(\'' + key + '\')">' + ic('chat', '#233F86', 16) + esc(label) + '</button>';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function ago(t) {
  if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'щойно';
  if (m < 60) return m + ' хв тому';
  const d = new Date(t), n = new Date();
  const hm = d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === n.toDateString()) return 'сьогодні, ' + hm;
  const y = new Date(n); y.setDate(n.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'вчора, ' + hm;
  return d.toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' });
}
function haptic(type) { try { tg && tg.HapticFeedback && (type === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred('light')); } catch (e) {} }
function toast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.innerHTML = ''; }, 2600);
}
function entName(e) { return e ? 'Під’їзд ' + e : 'Весь будинок'; }
function visible(e) { return ui.all || !e || !D.me.entrance || e === D.me.entrance; }
function isOwner() { return /власн/.test(D.me.role || ''); }

// ---------- сервер ----------
async function api(action, data) {
  if (DEMO) return demoApi(action, data || {});
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action, initData: tg ? tg.initData : '' }, data || {}))
  });
  const j = await res.json();
  if (j.error) throw new Error(j.error);
  return j;
}
async function run(action, data, okMsg) {
  if (busy) return false;
  busy = true;
  try {
    D = await api(action, data);
    save();
    if (okMsg) { toast(okMsg); haptic('ok'); }
    render();
    return true;
  } catch (e) {
    toast(e.message || 'Помилка, спробуйте ще раз');
    return false;
  } finally { busy = false; }
}
function save() { try { localStorage.setItem('b8_cache', JSON.stringify(D)); } catch (e) {} }

// ---------- навігація ----------
function go(r) {
  if (['new', 'useful', 'admin'].indexOf(r) >= 0) stack.push(route); else stack = [];
  route = r; render(); window.scrollTo(0, 0);
}
function back() { route = stack.pop() || 'home'; render(); window.scrollTo(0, 0); }
function syncBack() {
  if (!tg || !tg.BackButton) return;
  if (stack.length) tg.BackButton.show(); else tg.BackButton.hide();
}

// ---------- екрани ----------
function render() {
  if (!D) { $app.innerHTML = skeleton(); return; }
  if (D.me.state !== 'accepted' && !D.me.isAdmin) { $app.innerHTML = gate(); return; }
  const s = { home: home, problems: problems, polls: polls, me: cabinet, new: newProblem, useful: useful, admin: admin }[route] || home;
  $app.innerHTML = '<div class="screen">' + s() + '</div>' + tabs();
  syncBack();
}

function skeleton() {
  return '<div class="screen"><div class="skel" style="height:50px;width:60%"></div><div class="skel" style="height:170px"></div><div class="skel" style="height:64px"></div><div class="skel" style="height:90px"></div><div class="skel" style="height:90px"></div></div>';
}

function gate() {
  const st = D.me.state;
  const title = st === 'pending' ? 'Заявка на розгляді' : st === 'rejected' ? 'Заявку не підтверджено' : 'Вітаємо в «8 будинок»';
  const text = st === 'pending' ? 'Михайло перевіряє вашу заявку. Як тільки підтвердить, застосунок відкриється автоматично.'
    : st === 'rejected' ? 'Якщо це помилка, напишіть адміністратору або подайте анкету ще раз.'
    : 'Застосунок для мешканців будинку. Щоб увійти, пройдіть коротку анкету в боті: це хвилина.';
  const btn = st === 'pending' ? '<button class="btn ghost" onclick="location.reload()">Перевірити ще раз</button>'
    : '<button class="btn clay" onclick="openBot()">Пройти анкету</button>';
  return '<div class="center"><div class="h2">' + title + '</div><div style="color:var(--muted);line-height:1.5;max-width:320px">' + text + '</div>' + btn + '</div>';
}
function openBot() {
  const url = 'https://t.me/' + CONFIG.BOT_USERNAME;
  if (tg && tg.openTelegramLink) { tg.openTelegramLink(url); tg.close(); } else location.href = url;
}

function tabs() {
  const t = [['home', 'home', 'Дім'], ['problems', 'tool', 'Проблеми'], ['polls', 'vote', 'Голосування'], ['me', 'user', 'Кабінет']];
  const cur = { new: 'problems', useful: 'home', admin: 'me' }[route] || route;
  return '<nav class="tabs">' + t.map(x => '<button class="' + (cur === x[0] ? 'on' : '') + '" onclick="go(\'' + x[0] + '\')">' + ic(x[1]) + x[2] + '</button>').join('') + '</nav>';
}

function scopeBtn() {
  return '<button class="scope" onclick="toggleScope()">' + ic('swap', '#5B6472', 14) + (ui.all ? 'Весь будинок' : 'Мій під’їзд') + '</button>';
}
function toggleScope() { ui.all = !ui.all; try { localStorage.setItem('b8_all', ui.all ? '1' : '0'); } catch (e) {} haptic(); render(); }

function lightCard() {
  const L = D.light || { status: 'unknown' };
  const t = L.status === 'on' ? 'Світло є' : L.status === 'off' ? 'Світла немає' : 'Невідомо';
  const sub = L.status === 'unknown' ? 'Відмітьтеся першим' : L.by === 'admin' ? 'оновив адміністратор · ' + ago(L.at)
    : 'за відмітками ' + L.count + ' ' + plural(L.count, 'сусіда', 'сусідів', 'сусідів') + ' · ' + ago(L.at);
  const mine = ui.myLight;
  return '<div class="light ' + L.status + '">' +
    '<div class="row" style="align-items:flex-start"><div style="display:flex;flex-direction:column;gap:4px">' +
    '<div class="label" style="color:rgba(255,255,255,.85)">Світло зараз</div><div class="big">' + t + '</div>' +
    '<div style="font-size:13px;opacity:.9">' + esc(sub) + '</div></div>' + ic('bulb', '#fff', 40) + '</div>' +
    '<div style="font-size:13px;font-weight:600">А у вас?</div>' +
    '<div class="grid2"><button class="btn b1' + (mine === 'on' ? ' picked' : '') + '" onclick="markLight(true)">Світло є</button>' +
    '<button class="btn b2' + (mine === 'off' ? ' picked' : '') + '" onclick="markLight(false)">Світла немає</button></div></div>';
}
function plural(n, a, b, c) { n = Math.abs(n) % 100; const m = n % 10; if (n > 10 && n < 20) return c; if (m > 1 && m < 5) return b; if (m === 1) return a; return c; }
function markLight(on) { ui.myLight = on ? 'on' : 'off'; haptic(); run('light', { on: on }, 'Дякуємо, відмітку враховано'); }

function home() {
  const me = D.me;
  const st = D.statuses.filter(s => !isLift(s) && (!s.entrance || s.entrance === me.entrance));
  const myLifts = D.statuses.filter(s => isLift(s) && me.entrance && s.entrance === me.entrance);
  const liftCard = myLifts.length ? '<div class="card"><div class="row"><span style="font-weight:700">Ліфти · під’їзд ' + me.entrance + '</span><span class="sub" style="font-weight:500">зелений — працює</span></div><div class="lifts">' +
    myLifts.map(s => '<div class="lift ' + (s.tone === 'ok' ? 'ok' : 'bad') + '"><i></i>' + esc(liftName(s)) + '</div>').join('') + '</div></div>' : '';
  const tiles = st.map(s => '<div class="tile"><span class="k">' + esc(s.name + (s.entrance ? ' п. ' + s.entrance : '')) + '</span><span class="v t-' + esc(s.tone) + '">' + esc(s.value) + '</span></div>').join('');
  const feed = [].concat(
    D.news.filter(n => visible(n.entrance)).map(n => ({ t: n.time, html: '<div class="card" style="gap:4px"><div class="row"><span class="tag ' + (n.entrance ? 'info' : 'bad') + '">' + (n.entrance ? entName(n.entrance) : 'Терміново') + '</span><span class="sub" style="font-weight:500">' + ago(n.time) + '</span></div><div style="font-weight:700;white-space:pre-line">' + esc(n.text) + '</div>' + '</div>' })),
    D.problems.filter(p => p.status !== 'Вирішено' && visible(p.entrance)).map(p => ({ t: p.created, html: '<div class="card" style="gap:4px" onclick="go(\'problems\')"><div class="row"><span class="tag ' + (p.entrance === me.entrance && p.entrance ? 'info' : p.entrance ? 'soft' : 'bad') + '">' + entName(p.entrance) + '</span><span class="sub" style="font-weight:500">' + ago(p.created) + '</span></div><div style="font-weight:700">' + esc(p.category) + ': ' + esc(p.text) + '</div><div class="sub" style="font-weight:500">' + p.count + ' ' + plural(p.count, 'квартира', 'квартири', 'квартир') + ' · ' + esc(p.status.toLowerCase()) + '</div></div>' }))
  ).sort((a, b) => b.t - a.t).slice(0, 5);
  return '<div class="row"><div><div class="sub">' + (me.entrance ? 'Під’їзд ' + me.entrance + ' · ' : '') + (me.apt ? 'кв. ' + esc(me.apt) : 'адміністратор') + '</div><div class="h1">8 будинок</div></div>' +

  if (p.status !== 'Вирішено' && !p.own) html += '<button class="btn sm ' + (p.mine ? 'ghost' : '') + '" onclick="metoo(' + p.id + ')">' + (p.mine ? 'Ви відмітились' : 'У мене теж') + '</button>';

function pollCard(p) {

      return '<div style="display:flex;flex-direction:column;gap:4px"><div class="row" style="font-size:14px;font-weight:600"><span>' + esc(o) + (p.voted === o ? ' · ваш голос' : '') + '</span><span>' + p.counts[i] + ' (' + pct + '%)</span></div><div class="bar" style="height:8px"><i style="width:' + pct + '%;background:' + colors[i % colors.length] + '"></i></div></div>';
    }).join('');

  if (canVote) {
    h += '<div style="display:flex;flex-direction:column;gap:8px">' + (p.voted ? '<div class="sub">Змінити голос:</div>' : '') +
      p.options.map(o => '<button class="btn ' + (p.voted === o ? 'green' : 'ghost') + '" onclick="vote(' + p.id + ',this.dataset.o)" data-o="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';

}

async function start() {

        { row: 3, name: 'Опалення', value: 'Пуск', tone: 'info', entrance: 0, options: [{ value: 'Є', tone: 'ok' }, { value: 'Немає', tone: 'bad' }, { value: 'Пуск', tone: 'info' }] },
      ].concat([1, 2, 3, 4].reduce((a, e) => a.concat(['лівий', 'правий', 'вантажний'].map((n, k) => {
        const bad = (e === 1 && k === 0) || (e === 2 && k === 2);

      })), [])),
      light: { status: 'on', at: now - 3 * 60000, count: 14, by: 'neighbors' },
      problems: [
        { id: 14, created: now - 2 * H, entrance: 2, category: 'Двері / доводчик', place: 'вхід', text: 'Вхідні двері не зачиняються', status: 'В роботі', count: 8, mine: false, own: false, authorApt: '81' },
        { id: 13, created: now - 5 * H, entrance: 0, category: 'Вода', place: '', text: 'Немає гарячої води', status: 'Нова', count: 23, mine: true, own: false, authorApt: '12' },
        { id: 12, created: now - 30 * H, entrance: 1, category: 'Ліфт', place: '', text: 'Ліфт зупинено, чекаємо майстра', status: 'В роботі', count: 21, mine: false, own: false, authorApt: '40' },
        { id: 9, created: now - 140 * H, entrance: 2, category: 'Світло в під’їзді', place: '7 поверх', text: 'Не світить лампа на сходах', status: 'Вирішено', count: 3, mine: false, own: true, authorApt: '76' }
      ],

      polls: [
        { id: 2, question: 'Чи підтримуєте ви створення ОСББ у нашому будинку?', options: ['Так, за', 'Ні', 'Ще не визначився'], counts: [187, 24, 31], open: true, ownersOnly: true, voted: null, total: 242 },
        { id: 1, question: 'Зручний час для зборів', options: ['Субота, 12:00', 'Неділя, 18:00'], counts: [96, 52], open: false, ownersOnly: false, voted: 'Субота, 12:00', total: 148 }
      ],
      useful: [
        { section: 'Тривога і відключення', name: 'Укриття', desc: '[Де саме, вхід з якого під’їзду]', phone: '' },

        { section: 'Тривога і відключення', name: 'Пункт незламності', desc: '[Найближча адреса]', phone: '' },
        { section: 'Контакти', name: 'Аварійна служба УК', desc: 'цілодобово', phone: '[номер]' },
        { section: 'Контакти', name: 'Гаряча лінія міста', desc: 'скарги на комунальні служби', phone: '1551' }
      ],
      totalApts: 566, entrances: 4, now: now
    };
  }
  const db = DEMO_DB;
  if (action === 'light') { if (d.on) { db.light.status = 'on'; db.light.count++; } else { db.light = { status: 'off', at: now, count: 2, by: 'neighbors' }; } db.light.at = now; }
  if (action === 'metoo') { const p = db.problems.find(x => x.id === d.id); p.mine = !p.mine; p.count += p.mine ? 1 : -1; }
  if (action === 'newProblem') db.problems.unshift({ id: 15, created: now, entrance: d.wholeHouse ? 0 : 2, category: d.category, place: d.place, text: d.text, status: 'Нова', count: 1, mine: false, own: true, authorApt: '76' });
  if (action === 'vote') { const p = db.polls.find(x => x.id === d.id); if (p.voted) { p.counts[p.options.indexOf(p.voted)]--; } else p.total++; p.voted = d.option; p.counts[p.options.indexOf(d.option)]++; }
  if (action === 'problemStatus') db.problems.find(x => x.id === d.id).status = d.status;
  if (action === 'setStatus') { const s = db.statuses.find(x => x.row === d.row); s.value = d.value; s.tone = d.tone; }
  if (action === 'lightSet') db.light = { status: d.on ? 'on' : 'off', at: now, count: 0, by: 'admin' };
  if (action === 'urgent') db.news.unshift({ time: now, entrance: d.entrance, text: d.text });
  if (action === 'newPoll') db.polls.unshift({ id: 3, question: d.question, options: d.options, counts: d.options.map(() => 0), open: true, ownersOnly: d.ownersOnly, voted: null, total: 0 });
  if (action === 'closePoll') db.polls.find(x => x.id === d.id).open = false;
  if (action === 'deletePoll') db.polls = db.polls.filter(x => x.id !== d.id);
  return new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify(db))), 250));
}
